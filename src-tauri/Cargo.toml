[package]
name = "nekotify"
version = "0.1.0"
description = "A lightweight, local-first desktop music player."
authors = ["meshahid973"]
license = "MIT"
repository = "https://github.com/meshahid973/nekotify"
edition = "2024"
rust-version = "1.90"

[lib]
name = "nekotify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
