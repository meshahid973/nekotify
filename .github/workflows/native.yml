name: Native
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/native.yml'
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Format and export Rust sources
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          foreach ($path in @('src-tauri/src/database.rs', 'src-tauri/src/library.rs', 'src-tauri/src/lib.rs')) {
            Write-Host "BEGIN_FORMATTED:$path"
            Write-Host ([Convert]::ToBase64String([System.IO.File]::ReadAllBytes($path)))
            Write-Host "END_FORMATTED:$path"
          }
