name: Frontend
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/frontend.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve Base UI dependency lockfile (temporary)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo BEGIN_BASEUI_LOCK
          base64 -w 0 package-lock.json | fold -w 4000
          echo END_BASEUI_LOCK
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run check
